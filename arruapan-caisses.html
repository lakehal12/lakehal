<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arruapan caisses</title>
<style>
:root{--bg:#F5F1E8;--fg:#20332D;--card:#FFFCF5;--pri:#285847;--onpri:#fff;--mut:#68776F;--bd:#E0DACB;--bad:#B3402F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201B;--fg:#EDEBE3;--card:#1C2B25;--pri:#4E9A7C;--onpri:#0E1713;--mut:#9AAAA2;--bd:#2C3E36;--bad:#E5806F}}
:root[data-theme="dark"]{--bg:#14201B;--fg:#EDEBE3;--card:#1C2B25;--pri:#4E9A7C;--onpri:#0E1713;--mut:#9AAAA2;--bd:#2C3E36;--bad:#E5806F}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
h1{flex:1;font-size:21px;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:var(--onpri);font-weight:600}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
input{font:inherit;width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.total{background:var(--pri);color:var(--onpri);border-radius:20px;padding:20px;margin-bottom:12px}
.total small{opacity:.85;letter-spacing:1px;font-weight:700;font-size:11px}
.total b{display:block;font-size:48px;line-height:1.2}
#status{font-size:12px;color:var(--mut);margin:0 0 16px}
#status.bad{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--bd);margin-bottom:9px;padding:14px}
.row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{font-size:22px;color:var(--pri)}
.sum{font-size:12px;color:var(--mut);margin:8px 2px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.sheet label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.cnt{display:flex;gap:8px}.cnt button{width:64px;font-size:22px}.cnt input{text-align:center;font-size:22px;font-weight:700}
.err{color:var(--bad);font-size:13px;margin:8px 0 0;min-height:16px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <header><h1>Arruapan caisses</h1><button id="add">+ Add store</button></header>
  <div class="total"><small>CAISSES STILL OUT</small><b id="total">0</b><span id="across"></span></div>
  <p id="status">Connecting…</p>
  <input id="q" type="search" placeholder="Search a supermarket" autocomplete="off">
  <p class="sum" id="sum"></p>
  <div id="list"></div>
</main>
<div class="sheet hide" id="sheet"><div>
  <h2 id="stitle" style="margin:0 0 4px;font-size:19px"></h2>
  <label for="nm">Supermarket name</label><input id="nm" maxlength="60">
  <div id="cwrap"><label for="ct">Caisses still there</label>
    <div class="cnt"><button class="alt" id="minus">−</button><input id="ct" inputmode="numeric"><button class="alt" id="plus">+</button></div></div>
  <p class="err" id="err"></p>
  <div style="display:flex;gap:10px"><button class="alt" id="cancel" style="flex:1">Cancel</button><button id="save" style="flex:2">Save</button></div>
</div></div>
<script>
let db = null, stores = [], editId = null;
const $ = (id) => document.getElementById(id);
const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
function setStatus(t, bad) { $('status').textContent = t; $('status').className = bad ? 'bad' : ''; }

function render() {
  const q = norm($('q').value);
  const total = stores.reduce((t, s) => t + (s.count || 0), 0);
  $('total').textContent = total;
  $('across').textContent = 'Across ' + stores.length + (stores.length === 1 ? ' supermarket' : ' supermarkets');
  const shown = stores.filter((s) => norm(s.name || '').includes(q))
    .sort((a, b) => (b.count || 0) - (a.count || 0) || (a.name || '').localeCompare(b.name || ''));
  $('sum').textContent = q ? shown.length + ' found · ' + shown.reduce((t, s) => t + (s.count || 0), 0) + ' caisses' : '';
  const list = $('list'); list.textContent = '';
  if (!shown.length) {
    const p = document.createElement('p'); p.className = 'sum';
    p.textContent = stores.length ? 'No supermarket found.' : 'No supermarkets yet. Tap “+ Add store”.';
    list.appendChild(p);
  }
  for (const s of shown) {
    const b = document.createElement('button'); b.className = 'row';
    const n = document.createElement('span'); n.textContent = s.name;
    const c = document.createElement('b'); c.textContent = s.count || 0;
    b.append(n, c); b.onclick = () => openSheet(s.id); list.appendChild(b);
  }
}

function openSheet(id) {
  editId = id; const s = stores.find((x) => x.id === id);
  $('stitle').textContent = s ? 'Edit supermarket' : 'Add a supermarket';
  $('nm').value = s ? s.name : ''; $('ct').value = s ? (s.count || 0) : 0;
  $('err').textContent = ''; $('sheet').classList.remove('hide'); $('nm').focus();
}
const closeSheet = () => $('sheet').classList.add('hide');
const step = (d) => { $('ct').value = Math.max(0, (parseInt($('ct').value, 10) || 0) + d); };

async function save() {
  const name = $('nm').value.trim(), raw = $('ct').value.trim(), count = Number(raw);
  if (!name) return ($('err').textContent = 'Enter the supermarket name.');
  if (raw === '' || !Number.isInteger(count) || count < 0) return ($('err').textContent = 'Enter a whole number, 0 or more.');
  if (stores.some((s) => s.id !== editId && norm(s.name || '') === norm(name))) return ($('err').textContent = 'This supermarket is already on your list.');
  try {
    if (editId) await db.doc('stores/' + editId).update({ name, count });
    else await db.collection('stores').add({ name, count, createdAt: Date.now() });
    closeSheet();
  } catch (e) { $('err').textContent = 'Could not save. Check your connection.'; }
}

$('add').onclick = () => (db ? openSheet(null) : null);
$('cancel').onclick = closeSheet; $('save').onclick = save;
$('minus').onclick = () => step(-1); $('plus').onclick = () => step(1);
$('q').oninput = render;
$('sheet').onclick = (e) => { if (e.target === $('sheet')) closeSheet(); };

(async function init() {
  render();
  try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) return setStatus('Sharing is off. Open this link while signed in to your Claude account.', true);
  db.collection('stores').onSnapshot(
    (snap) => { stores = snap.docs.map((d) => ({ id: d.id, ...d.data() })); setStatus('Shared with your other phones · live'); render(); },
    () => setStatus('Connection problem. Your list will update when it is back.', true)
  );
})();
</script>
</body>
</html>
