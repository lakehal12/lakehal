<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#285847">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arruapan caisses">
<title>Arruapan caisses</title>
<style>
:root{--bg:#F5F1E8;--fg:#20332D;--card:#FFFCF5;--pri:#285847;--onpri:#fff;--mut:#68776F;--bd:#E0DACB;--bad:#B3402F;--mu:#ECE6D8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201B;--fg:#EDEBE3;--card:#1C2B25;--pri:#4E9A7C;--onpri:#0E1713;--mut:#9AAAA2;--bd:#2C3E36;--bad:#E5806F;--mu:#24352E}}
:root[data-theme="dark"]{--bg:#14201B;--fg:#EDEBE3;--card:#1C2B25;--pri:#4E9A7C;--onpri:#0E1713;--mut:#9AAAA2;--bd:#2C3E36;--bad:#E5806F;--mu:#24352E}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main,#codeScreen{max-width:560px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
h1{flex:1;font-size:21px;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:var(--onpri);font-weight:600}
button.alt{background:var(--mu);color:var(--fg)}
button.sel{background:var(--pri);color:var(--onpri)}
button:disabled{opacity:.6}
input{font:inherit;width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.total{background:var(--pri);color:var(--onpri);border-radius:20px;padding:20px;margin-bottom:10px}
.total small{opacity:.85;letter-spacing:1px;font-weight:700;font-size:11px}
.total b{display:block;font-size:48px;line-height:1.2}
#status{display:block;background:none;color:var(--mut);padding:4px 0;margin:0 0 14px;font-size:12px;font-weight:500;text-align:left}
#status.bad{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--bd);margin-bottom:9px;padding:14px}
.row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{font-size:22px;color:var(--pri)}
.sum{font-size:12px;color:var(--mut);margin:8px 2px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.top{display:flex;align-items:center;gap:8px}.top h2{flex:1;margin:0;font-size:19px;overflow-wrap:anywhere}
.top button{padding:9px 13px}
.bal{background:var(--pri);color:var(--onpri);border-radius:16px;padding:14px 16px;margin:14px 0}
.bal b{font-size:34px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.two{display:flex;gap:8px}.two button{flex:1}
.err{color:var(--bad);font-size:13px;margin:8px 0 0;min-height:16px}
.box{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:12px;margin-top:12px}
.hist{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hist:last-child{border:0}
.hide{display:none!important}
#codeScreen{text-align:center;padding-top:60px}
</style>
</head>
<body>
<div id="codeScreen" class="hide">
  <h1 style="margin-bottom:8px">Enter your access code</h1>
  <p class="sum">Use the same code on all your phones.</p>
  <input id="code" autocapitalize="none" autocomplete="off" placeholder="Access code" style="text-align:center;margin:16px 0 4px">
  <p class="err" id="cerr"></p>
  <button id="connect" style="width:100%">Connect</button>
</div>
<main id="main">
  <header><h1>Arruapan caisses</h1><button id="add">+ Add store</button></header>
  <div class="total"><small>CAISSES STILL OUT</small><b id="total">0</b><span id="across"></span></div>
  <button id="status" type="button">Starting…</button>
  <input id="q" type="search" placeholder="Search a supermarket" autocomplete="off">
  <p class="sum" id="sum"></p>
  <div id="list"></div>
</main>
<div class="sheet hide" id="sheet"><div id="sbody"></div></div>
<script src="config.js"></script>
<script>
(function () {
'use strict';
const CFG = window.APP_CONFIG || {};
const URL_ = String(CFG.SUPABASE_URL || '').trim().replace(/\/+$/, '');
const KEY = String(CFG.SUPABASE_ANON_KEY || '').trim();
const CONFIGURED = URL_.startsWith('https://') && !URL_.includes('PASTE') && KEY.length > 20 && !KEY.includes('PASTE');
const LS = 'arruapan:v1';
const $ = (id) => document.getElementById(id);
const uid = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
const label = (n) => (n === 1 ? 'caisse' : 'caisses');
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (k === 'value') e.value = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

// ---------- saved data ----------
let st = { code: null, server: [], outbox: [] };
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s && Array.isArray(s.server) && Array.isArray(s.outbox)) st = s; } catch (e) {}
function save() { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} }

// ---------- server calls ----------
async function rpc(fn, args) {
  const headers = { 'Content-Type': 'application/json', apikey: KEY };
  if (KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + KEY;
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  let r;
  try { r = await fetch(URL_ + '/rest/v1/rpc/' + fn, { method: 'POST', headers, body: JSON.stringify(args), signal: ctl.signal }); }
  catch (e) { const x = new Error('No connection'); x.net = true; throw x; }
  finally { clearTimeout(t); }
  const text = await r.text();
  if (!r.ok) { const x = new Error(text.includes('bad_code') ? 'Wrong code' : 'Server ' + r.status + ': ' + text.slice(0, 140)); x.bad = text.includes('bad_code'); throw x; }
  return text ? JSON.parse(text) : null;
}
const fetchStores = async (code) => (await rpc('list_stores', { p_code: code })).map((r) => ({ id: String(r.id), name: String(r.name), createdAt: String(r.createdAt), balance: Number(r.balance) || 0 }));
const fetchMoves = async (code, id) => (await rpc('list_movements', { p_code: code, p_store_id: id })).map((r) => ({ id: String(r.id), type: r.type === 'return' ? 'return' : 'delivery', count: Number(r.count) || 0, createdAt: String(r.createdAt) }));

// ---------- what the screen shows = server list + changes not sent yet ----------
function applyOp(list, op) {
  if (op.kind === 'addStore') return list.some((s) => s.id === op.id) ? list : [...list, { id: op.id, name: op.name, createdAt: op.createdAt, balance: 0 }];
  if (op.kind === 'rename') return list.map((s) => (s.id === op.id ? { ...s, name: op.name } : s));
  return list.map((s) => (s.id === op.storeId ? { ...s, balance: s.balance + (op.type === 'delivery' ? op.count : -op.count) } : s));
}
function stores() { const seen = new Set(); let l = st.server; for (const o of st.outbox) { if (seen.has(o.opId)) continue; seen.add(o.opId); l = applyOp(l, o); } return l; }
function dispatch(op) { st.outbox.push(op); save(); render(); renderHist(); sync(); }
const addStore = (name) => dispatch({ opId: uid(), kind: 'addStore', id: uid(), name, createdAt: new Date().toISOString() });
const renameStore = (id, name) => dispatch({ opId: uid(), kind: 'rename', id, name });
const move = (storeId, type, count) => { const id = uid(); dispatch({ opId: id, kind: 'movement', id, storeId, type, count, createdAt: new Date().toISOString() }); };

// ---------- sync ----------
let syncing = false, again = false, status = CONFIGURED ? 'syncing' : 'local', statusMsg = '', serverHist = [], openId = null;
function setStatus(s, m) { status = s; statusMsg = m || ''; render(); }
async function sync() {
  if (!CONFIGURED || !st.code) return;
  if (syncing) { again = true; return; }
  syncing = true;
  if (st.outbox.length || status !== 'synced') setStatus('syncing');
  try {
    do {
      again = false; const code = st.code; if (!code) break;
      const batch = st.outbox.slice(0, 200);
      if (batch.length) {
        await rpc('apply_ops', { p_code: code, p_ops: batch });
        const sent = new Set(batch.map((o) => o.opId)); st.outbox = st.outbox.filter((o) => !sent.has(o.opId)); save();
        if (st.outbox.length) { again = true; continue; }
      }
      st.server = await fetchStores(code); save();
    } while (again);
    setStatus('synced'); if (openId) loadHist();
  } catch (e) {
    if (e.bad) { st.code = null; save(); showGate(); setStatus('error', 'The access code was refused.'); }
    else if (e.net) setStatus('offline'); else setStatus('error', e.message);
  } finally { syncing = false; }
}

// ---------- main screen ----------
function render() {
  const all = stores(), q = norm($('q').value);
  const sum = (l) => l.reduce((t, s) => t + s.balance, 0);
  $('total').textContent = sum(all);
  $('across').textContent = 'Across ' + all.length + (all.length === 1 ? ' supermarket' : ' supermarkets');
  const shown = all.filter((s) => norm(s.name).includes(q)).sort((a, b) => b.balance - a.balance || a.name.localeCompare(b.name));
  $('sum').textContent = q ? shown.length + ' of ' + all.length + ' found · ' + sum(shown) + ' ' + label(sum(shown)) : '';
  const n = st.outbox.length;
  const text = { local: 'Cloud not set up yet · saved on this phone only', syncing: 'Syncing…', error: 'Server problem' + (statusMsg ? ' · ' + statusMsg : ''),
    offline: n ? 'Offline · ' + n + (n === 1 ? ' change' : ' changes') + ' waiting to send' : 'Offline · showing the last saved list',
    synced: 'Shared with your other phones · up to date (tap to refresh)' }[status];
  $('status').textContent = text; $('status').className = status === 'offline' || status === 'error' ? 'bad' : '';
  const list = $('list'); list.textContent = '';
  if (!shown.length) {
    list.append(h('p', { class: 'sum' }, all.length ? 'No supermarket found.' : 'No supermarkets yet. Tap “+ Add store”.'));
    if (all.length && q) list.append(h('button', { onclick: () => openAdd($('q').value.trim()) }, 'Add “' + $('q').value.trim() + '”'));
  }
  for (const s of shown) list.append(h('button', { class: 'row', onclick: () => openDetail(s.id) }, h('span', {}, s.name), h('b', {}, String(s.balance))));
}

// ---------- sheets ----------
const sheet = $('sheet'), body = $('sbody');
function closeSheet() { sheet.classList.add('hide'); openId = null; serverHist = []; }
function openSheet(nodes) { body.textContent = ''; body.append(...nodes); sheet.classList.remove('hide'); }
sheet.onclick = (e) => { if (e.target === sheet) closeSheet(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

function openAdd(prefill) {
  const inp = h('input', { maxlength: '60', placeholder: 'Supermarket name', value: prefill || '' }), err = h('p', { class: 'err' });
  const go = () => {
    const name = inp.value.trim();
    if (!name) { err.textContent = 'Enter the supermarket name.'; return; }
    if (stores().some((s) => norm(s.name) === norm(name))) { err.textContent = 'This supermarket is already on your list.'; return; }
    addStore(name); closeSheet(); $('q').value = ''; render();
  };
  inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  openSheet([h('div', { class: 'top' }, h('h2', {}, 'Add a supermarket'), h('button', { class: 'alt', onclick: closeSheet }, '✕')), h('label', {}, 'Name'), inp, err,
    h('button', { style: 'width:100%;margin-top:6px', onclick: go }, 'Add supermarket')]);
  inp.focus();
}

function openDetail(id) {
  openId = id; serverHist = [];
  const cur = () => stores().find((s) => s.id === id);
  let type = 'delivery';
  const title = h('h2', {}), bal = h('b', {}), balTxt = h('span', {});
  const nm = h('input', { maxlength: '60' }), nerr = h('p', { class: 'err' });
  const rbox = h('div', { class: 'box hide' }, h('label', { style: 'margin-top:0' }, 'Supermarket name'), nm, nerr,
    h('div', { class: 'two', style: 'margin-top:10px' }, h('button', { class: 'alt', onclick: () => rbox.classList.add('hide') }, 'Cancel'),
      h('button', { onclick: () => {
        const name = nm.value.trim(), s = cur();
        if (!name) { nerr.textContent = 'Enter the supermarket name.'; return; }
        if (stores().some((x) => x.id !== id && norm(x.name) === norm(name))) { nerr.textContent = 'Another supermarket already has this name.'; return; }
        if (s && name !== s.name) renameStore(id, name);
        rbox.classList.add('hide');
      } }, 'Save name')));
  const bDel = h('button', { class: 'sel' }, 'Delivered +'), bRet = h('button', { class: 'alt' }, 'Returned −');
  const pick = (t) => { type = t; bDel.className = t === 'delivery' ? 'sel' : 'alt'; bRet.className = t === 'return' ? 'sel' : 'alt'; };
  bDel.onclick = () => pick('delivery'); bRet.onclick = () => pick('return');
  const cnt = h('input', { inputmode: 'numeric', placeholder: 'Number of caisses' }), merr = h('p', { class: 'err' });
  const rec = () => {
    const c = Number(cnt.value), s = cur(); if (!s) return;
    if (!Number.isInteger(c) || c < 1) { merr.textContent = 'Enter a whole number greater than zero.'; return; }
    if (type === 'return' && c > s.balance) { merr.textContent = 'Only ' + s.balance + ' ' + label(s.balance) + ' are out at this supermarket.'; return; }
    move(id, type, c); cnt.value = ''; merr.textContent = '';
  };
  cnt.onkeydown = (e) => { if (e.key === 'Enter') rec(); };
  const ex = h('input', { inputmode: 'numeric', placeholder: 'Exact total' }), xerr = h('p', { class: 'err' });
  const setEx = () => {
    const t = Number(ex.value), s = cur(); if (!s) return;
    if (ex.value.trim() === '' || !Number.isInteger(t) || t < 0) { xerr.textContent = 'Enter a whole number, 0 or more.'; return; }
    if (t !== s.balance) move(id, t > s.balance ? 'delivery' : 'return', Math.abs(t - s.balance));
    ex.value = ''; xerr.textContent = '';
  };
  const hist = h('div', { id: 'hist' });
  refreshDetail = () => { const s = cur(); if (!s) { closeSheet(); return; } title.textContent = s.name; bal.textContent = String(s.balance); balTxt.textContent = ' ' + label(s.balance) + ' still at this store'; };
  openSheet([h('div', { class: 'top' }, title, h('button', { class: 'alt', 'aria-label': 'Edit name', onclick: () => { nm.value = cur().name; nerr.textContent = ''; rbox.classList.remove('hide'); nm.focus(); } }, '✎'),
      h('button', { class: 'alt', onclick: closeSheet }, '✕')),
    rbox, h('div', { class: 'bal' }, bal, balTxt),
    h('div', { class: 'two' }, bDel, bRet), h('label', {}, 'How many caisses?'), cnt, merr, h('button', { style: 'width:100%', onclick: rec }, 'Record'),
    h('label', {}, 'Or set the exact total'), h('div', { class: 'two' }, ex, h('button', { class: 'alt', style: 'flex:0 0 auto', onclick: setEx }, 'Set')), xerr,
    h('label', {}, 'Recent activity'), hist]);
  refreshDetail(); renderHist(); loadHist();
}
let refreshDetail = () => {};

function histRows() {
  const pend = st.outbox.filter((o) => o.kind === 'movement' && o.storeId === openId).map((o) => ({ id: o.id, type: o.type, count: o.count, createdAt: o.createdAt })).reverse();
  return [...pend, ...serverHist.filter((r) => !pend.some((p) => p.id === r.id))].slice(0, 8);
}
function renderHist() {
  const el = $('hist'); if (!el || !openId) return; refreshDetail();
  const rows = histRows(); el.textContent = '';
  if (!rows.length) el.append(h('p', { class: 'sum' }, 'No activity yet.'));
  for (const r of rows) {
    const d = new Date(r.createdAt), today = d.toDateString() === new Date().toDateString();
    el.append(h('div', { class: 'hist' }, h('span', {}, (r.type === 'delivery' ? 'Delivered' : 'Returned') + ' · ' + (today ? 'Today' : d.toLocaleDateString('en', { day: 'numeric', month: 'short' }))),
      h('b', { style: 'color:var(' + (r.type === 'delivery' ? '--pri' : '--bad') + ')' }, (r.type === 'delivery' ? '+' : '−') + r.count)));
  }
}
async function loadHist() {
  if (!CONFIGURED || !st.code || !openId) return; const id = openId;
  try { const rows = await fetchMoves(st.code, id); if (openId === id) { serverHist = rows; renderHist(); } } catch (e) {}
}

// ---------- access code ----------
function showGate() { $('main').classList.add('hide'); $('codeScreen').classList.remove('hide'); closeSheet(); }
function hideGate() { $('codeScreen').classList.add('hide'); $('main').classList.remove('hide'); }
$('connect').onclick = async () => {
  const code = $('code').value.trim(); if (!code) { $('cerr').textContent = 'Enter the code.'; return; }
  $('connect').disabled = true; $('cerr').textContent = '';
  try { st.server = await fetchStores(code); st.code = code; save(); $('code').value = ''; hideGate(); setStatus('syncing'); sync(); }
  catch (e) { $('cerr').textContent = e.bad ? 'Wrong code. Try again.' : e.net ? 'No internet connection. Try again.' : e.message; }
  $('connect').disabled = false;
};
$('code').onkeydown = (e) => { if (e.key === 'Enter') $('connect').click(); };

// ---------- start ----------
$('add').onclick = () => openAdd('');
$('q').oninput = render;
$('status').onclick = () => sync();
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
window.addEventListener('online', () => sync());
if (CONFIGURED && !st.code) showGate();
render(); sync();
})();
</script>
</body>
</html>
