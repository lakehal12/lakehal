<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#285847">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arruapan caisses">
<title>Arruapan caisses</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginScreen" class="big hide" style="max-width:420px;margin:0 auto;padding:50px 18px">
  <h1 style="margin-bottom:6px">Arruapan caisses</h1>
  <p class="sum">Connectez-vous avec votre compte.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocapitalize="none" autocomplete="username" placeholder="nom@exemple.com">
  <label for="pw">Mot de passe</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe">
  <p class="err" id="lerr"></p>
  <button id="loginBtn" style="width:100%">Se connecter</button>
</div>
<div id="pendingScreen" class="big hide" style="max-width:420px;margin:0 auto;padding:50px 18px">
  <h1>Compte en attente</h1>
  <p class="sum">Votre compte n’est pas encore activé. Demandez au responsable de l’activer, puis appuyez sur « Actualiser ».</p>
  <div class="two" style="margin-top:18px"><button id="pendRefresh">Actualiser</button><button class="alt" id="pendLogout">Déconnexion</button></div>
</div>
<main id="main" class="hide">
  <header><h1>Arruapan caisses</h1><button id="add" class="hide">+ Ajouter un magasin</button></header>
  <div class="total"><small>CAISSES ENCORE DEHORS</small><b id="total">0</b><span id="across"></span></div>
  <div class="cards hide" id="adminCards">
    <div><small>EN ENTREPÔT</small><b id="wh">0</b></div>
    <div><small>TOTAL (ENTREPÔT + DEHORS)</small><b id="all">0</b></div>
  </div>
  <div class="bar hide" id="adminBar">
    <button class="alt" id="bWh">Entrepôt</button><button class="alt" id="bLog">Journal</button><button class="alt" id="bTeam">Équipe</button>
  </div>
  <button id="status" type="button">Démarrage…</button>
  <input id="q" type="search" placeholder="Rechercher un supermarché" autocomplete="off">
  <p class="sum" id="sum"></p>
  <div id="list"></div>
  <div class="foot"><span id="who"></span><br><button class="alt" id="logout">Déconnexion</button><p class="err" id="lomsg"></p></div>
</main>
<div class="sheet hide" id="sheet"><div id="sbody"></div></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
